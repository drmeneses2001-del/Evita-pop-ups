<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Opciones — Evita Pop-ups y Anuncios</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 40px auto;
      color: #1a1a2e;
      padding: 0 16px;
    }
    h1 { font-size: 20px; }
    .card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      width: 70%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #3d5afe;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button.remove {
      background: #e53935;
      padding: 4px 8px;
      font-size: 12px;
    }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    label { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <h1>Evita Pop-ups y Anuncios — Opciones</h1>

  <div class="card">
    <label>
      <input type="checkbox" id="enabledToggle" />
      Activar protección contra pop-ups y anuncios
    </label>
  </div>

  <div class="card">
    <h2 style="font-size:15px;">Lista blanca (sitios permitidos)</h2>
    <p style="font-size:13px;color:#666;">Los sitios en esta lista podrán abrir ventanas emergentes y no se les bloquearán anuncios.</p>
    <input type="text" id="domainInput" placeholder="ejemplo.com" />
    <button id="addDomain">Añadir</button>
    <ul id="whitelistItems"></ul>
  </div>

  <script src="options.js"></script>
</body>
</html>
